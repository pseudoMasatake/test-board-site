name: Refresh SEO sitemap
on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Rebuild sitemap
        run: node scripts/refresh-sitemap.mjs
      - name: Commit changes
        shell: bash
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "No sitemap changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Refresh SEO sitemap"
          git push
