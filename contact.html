<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>問い合わせ | 裁判ウォッチ</title><meta name="robots" content="index,follow"><style>body{max-width:760px;margin:40px auto;padding:0 18px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;line-height:1.8;color:#111827}h1{font-size:28px}h2{font-size:19px;margin-top:28px}p{font-size:14px;color:#344054}a{color:#245b91}.box{background:#f6f7f9;border:1px solid #e5e7eb;border-radius:12px;padding:16px}</style></head><body><h1>問い合わせ</h1><div class="box"><p>掲載情報の訂正は各事件・人物ページの「訂正を依頼する」、投稿に関する問題は各投稿の「通報」をご利用ください。</p></div><h2>一般のお問い合わせ</h2><p>掲載内容に関する訂正依頼や投稿の通報は、サイト内の各機能から受け付けています。その他の問い合わせ方法は、本ページで案内します。</p><h2>権利侵害・削除依頼</h2><p>対象となるページ・投稿と、問題点が分かる情報を訂正依頼または通報機能からお知らせください。内容を確認のうえ対応します。</p><p><a href="index.html">裁判ウォッチへ戻る</a></p></body></html>
